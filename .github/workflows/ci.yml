on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: actions/cache@v5
        with:
          path: '~/.m2'
          key: "${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}"
          restore-keys: |
            ${{ runner.os }}-maven-
      - run: mvn verify
  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Cache
        uses: actions/cache@v5
        with:
          path: '~/.m2'
          key: "${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}"
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build
        run: mvn package
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Train.zip
            build/Train.tar.bz2
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
